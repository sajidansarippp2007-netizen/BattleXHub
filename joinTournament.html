<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Join Tournament</title>

<link rel="stylesheet" href="joinTournament.css">
</head>
<link rel="stylesheet" href="popup.css">
<script src="popup.js"></script>
<body>

<div class="joinBox">

<h2>🎮 Join Tournament</h2>

<img id="banner" class="banner">

<h3 id="title"></h3>

<p id="entry"></p>

<input
type="text"
id="ign"
placeholder="Enter In Game Name">

<input
type="number"
id="uid"
placeholder="Enter Free Fire UID">

<input
type="text"
id="mobile"
placeholder="Mobile Number (Optional)">

<button id="joinBtn">
Join Tournament
</button>

<button onclick="history.back()">
⬅ Back
</button>

</div>

<script type="module" src="joinTournament.js"></script>

</body>
</html>
