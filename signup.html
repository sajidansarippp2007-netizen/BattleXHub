<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BattleXHub Signup</title>

<link rel="stylesheet" href="signup.css">

</head>

<body>

<div class="loginBox">

<img src="assets/logo.png" class="logo">

<h1>BattleXHub</h1>
<div class="glowLine"></div>
<p>Create New Account</p>

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">
<input
type="text"
id="referralInput"
placeholder="Referral Code (Optional)">
<button id="signupBtn">
🎮 CREATE ACCOUNT
</button>

<p class="link">

Already have an account?

<a href="login.html">

Login

</a>

</p>

<p id="status"></p>

</div>

<script type="module" src="signup.js"></script>

</body>
</html>
