<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BattleXHub Login</title>

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="loginBox">

<img src="assets/logo.png" class="logo">

<h1>BattleXHub</h1>

<div class="glowLine"></div>

<p>Login To Continue</p>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">
🚀 LOGIN
</button>

<p class="link">

Don't have an account?

<a href="signup.html">
Sign Up
</a>

</p>

<p class="link">

<a href="forgot-password.html">
Forgot Password?
</a>

</p>

<p id="status"></p>

</div>

<script type="module" src="login.js"></script>

</body>

</html>
