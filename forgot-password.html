<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | BattleXHub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#0B0B0F;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.container{

width:90%;
max-width:400px;
background:#151A27;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,215,0,.2);

}

h1{

color:#FFD700;
text-align:center;
margin-bottom:10px;

}

p{

color:#ddd;
text-align:center;
margin-bottom:25px;

}

input{

width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:12px;
background:#23293A;
color:white;
font-size:16px;

}

button{

width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#FFD700;
color:#111;
font-size:18px;
font-weight:bold;
cursor:pointer;

}

button:hover{

background:#FFC107;

}

a{

display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
color:#FFD700;

}

</style>

</head>

<body>

<div class="container">

<h1>Forgot Password</h1>

<p>Enter your registered email address.</p>

<input
type="email"
id="email"
placeholder="Enter Email">

<button id="resetBtn">

RESET PASSWORD

</button>

<a href="login.html">

← Back to Login

</a>

</div>

<script type="module" src="js/auth.js"></script>

</body>

</html>
