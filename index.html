<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BattleXHub</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00bfff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BattleXHub">

  <script type="module">
    import { auth, onAuthStateChanged } from "./firebase.js";

    // Register Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .then(() => console.log("Service Worker Registered"))
          .catch(err => console.log("Service Worker Error:", err));
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "home.html";
      } else {
        window.location.href = "login.html";
      }
    });
  </script>
</head>

<body style="margin:0;background:#0d1117;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;">
  <div style="text-align:center;">
    <img src="assets/logo.png" alt="BattleXHub" width="120" height="120">
    <h2>Loading BattleXHub...</h2>
    <p>Please wait...</p>
  </div>
</body>
</html>
