<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Update Required</title>

<style>

body{

margin:0;
background:#111;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;

}

.box{

padding:30px;

}

h1{

color:gold;

}

button{

padding:15px 30px;
font-size:18px;
background:gold;
border:none;
border-radius:10px;
margin-top:20px;

}

</style>

</head>
<link rel="stylesheet" href="popup.css">
<script src="popup.js"></script>
<body>

<div class="box">

<h1>🚀 New Update Available</h1>

<p>

Please update BattleXHub to continue.

</p>

<button id="updateBtn">

Update Now

</button>

</div>

<script type="module">

import {
database,
ref,
get
} from "./firebase.js";

const snap = await get(ref(database,"settings"));

if(snap.exists()){

const s = snap.val();

document.getElementById("updateBtn").onclick=()=>{

location.href=s.updateLink;

};

}

</script>

</body>

</html>
